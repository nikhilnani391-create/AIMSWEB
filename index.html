<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D Car Game</title>
  </head>
  <body class="relative w-screen h-screen bg-gray-900 overflow-hidden text-white font-sans selection:bg-none">

    <!-- Game Canvas -->
    <canvas id="gameCanvas" class="block w-full h-full"></canvas>

    <!-- UI Overlay Container -->
    <div id="uiLayer" class="absolute inset-0 pointer-events-none flex flex-col justify-between">

      <!-- HUD (Heads Up Display) -->
      <div id="hud" class="hidden p-4 flex justify-between items-start w-full">
        <div class="text-2xl font-bold bg-black/50 px-4 py-2 rounded">
          Score: <span id="scoreDisplay">0</span>
        </div>
        <div class="text-lg bg-black/50 px-4 py-2 rounded text-gray-300">
          High Score: <span id="highScoreDisplay">0</span>
        </div>
      </div>

      <!-- Start Menu -->
      <div id="startMenu" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center pointer-events-auto">
        <h1 class="text-6xl font-extrabold mb-8 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">2D Car Game</h1>
        <div class="text-center mb-8 space-y-2 text-gray-300">
          <p>Use <span class="font-bold text-white">Arrow Keys</span> or <span class="font-bold text-white">WASD</span> to drive.</p>
          <p>Avoid crashing!</p>
        </div>
        <button id="startBtn" class="px-8 py-4 bg-blue-600 hover:bg-blue-500 text-xl font-bold rounded-full transition-transform transform hover:scale-105 shadow-lg shadow-blue-500/50">
          Start Game
        </button>
      </div>

      <!-- Game Over Screen -->
      <div id="gameOverScreen" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center pointer-events-auto">
        <h2 class="text-5xl font-bold text-red-500 mb-4">CRASHED!</h2>
        <p class="text-2xl mb-2">Final Score: <span id="finalScoreDisplay" class="font-bold">0</span></p>
        <p id="newHighScoreMsg" class="hidden text-xl text-yellow-400 font-bold mb-8 animate-bounce">New High Score!</p>
        <button id="restartBtn" class="px-8 py-4 bg-red-600 hover:bg-red-500 text-xl font-bold rounded-full transition-transform transform hover:scale-105 mt-4">
          Try Again
        </button>
      </div>

    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
